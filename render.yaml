# Blueprint opcional para Render.com
# Cree primero un PostgreSQL en el panel y copie su Internal/External DATABASE_URL al servicio web.
# https://render.com/docs/deploy-django
services:
  - type: web
    name: incasoft
    runtime: python
    region: oregon
    plan: starter
    buildCommand: chmod +x build.sh && ./build.sh
    releaseCommand: python manage.py migrate --noinput
    startCommand: gunicorn incasoft.wsgi:application --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
