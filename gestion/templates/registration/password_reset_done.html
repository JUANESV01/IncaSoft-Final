{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Correo enviado | INCASOFT Solutions</title>
    <link rel="stylesheet" href="{% static 'gestion/css/styles.css' %}">
    <style>
        .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--night); }
        .auth-card { width: min(480px, 100%); background: #fff; border-radius: var(--radius-lg); padding: 40px 36px; box-shadow: 0 32px 80px rgba(0,0,0,.35); }
        .auth-card h1 { font-family: var(--font-display); font-size: 1.5rem; margin: 0 0 12px; color: var(--night); }
        .auth-card p { color: var(--muted); font-size: 14px; line-height: 1.65; margin: 0 0 20px; }
    </style>
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <h1>Solicitud registrada</h1>
        <p>Si el correo indicado corresponde a un usuario activo del sistema, le hemos enviado un enlace para restablecer su contraseña. Revise también la carpeta de correo no deseado.</p>
        <p style="margin-bottom:0;"><a class="button ghost" href="{% url 'login' %}">← Volver al inicio de sesión</a></p>
    </div>
</div>
</body>
</html>
